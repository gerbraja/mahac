<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro Comercial TEI</title>
  
  <!-- SEO & Cache Control -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- PWA configurations -->
  <link id="pwa-manifest" rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Apple/iOS Web App optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TEI" />
  <link rel="apple-touch-icon" href="/tei-logo.png" />

  <script>
    (function () {
      var p = window.location.pathname || "";
      var manifestLink = document.getElementById("pwa-manifest");
      var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (p.indexOf("/transport/driver") === 0) {
        if (manifestLink) manifestLink.setAttribute("href", "/manifest-driver.json");
        if (appleTitle) appleTitle.setAttribute("content", "TEI Conductor");
        document.title = "TEI Conductor";
      } else if (p.indexOf("/transport/passenger") === 0) {
        if (manifestLink) manifestLink.setAttribute("href", "/manifest-passenger.json");
        if (appleTitle) appleTitle.setAttribute("content", "TEI Pasajero");
        document.title = "TEI Pasajero";
      }
    })();
  </script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
