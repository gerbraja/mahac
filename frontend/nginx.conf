server {
    listen 8080;
    server_tokens off;

    # Increase buffer sizes for large files like PDFs
    client_max_body_size 200M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block AI reverse-engineering / cloning bots & vulnerability scanners
    if ($http_user_agent ~* (readev|rea-ai|gptbot|ccbot|claudebot|anthropic-ai|bytespider|scrapy|httrack|webcopier|sqlmap|nikto|nmap|nuclei|dirbuster|gobuster)) {
        return 403;
    }

    # Never serve source maps or hidden dotfiles
    location ~* \.map$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # Serve static documents (PDFs, etc.) directly
    location /documentos/ {
        root /usr/share/nginx/html;
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/pdf pdf;
        }
        try_files $uri =404;
    }

    # Hashed static assets should return 404 if missing (never fallback to index.html)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Ensure index.html is never cached so clients always get current chunk hashes
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback for all other routes
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

